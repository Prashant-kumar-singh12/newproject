<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Illustration of an internship match dashboard">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e6bff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#1e6bff"/>
    </linearGradient>
  </defs>

  <!-- soft background blobs -->
  <circle cx="420" cy="70" r="90" fill="url(#g1)" opacity=".22"/>
  <circle cx="70" cy="370" r="70" fill="#22d3ee" opacity=".16"/>

  <!-- main panel -->
  <rect x="60" y="60" width="400" height="300" rx="24" fill="url(#g2)" stroke="#ffffff" stroke-opacity=".28"/>
  <rect x="60" y="60" width="400" height="52" rx="24" fill="#ffffff" fill-opacity=".07"/>
  <circle cx="88" cy="86" r="6" fill="#ff6b6b" opacity=".85"/>
  <circle cx="108" cy="86" r="6" fill="#ffd166" opacity=".85"/>
  <circle cx="128" cy="86" r="6" fill="#06d6a0" opacity=".85"/>
  <rect x="300" y="78" width="136" height="16" rx="8" fill="#ffffff" fill-opacity=".18"/>

  <!-- match rows -->
  <g>
    <rect x="86" y="134" width="348" height="54" rx="14" fill="#ffffff" fill-opacity=".10"/>
    <rect x="100" y="148" width="26" height="26" rx="8" fill="url(#g1)"/>
    <rect x="140" y="150" width="140" height="10" rx="5" fill="#ffffff" fill-opacity=".55"/>
    <rect x="140" y="166" width="90" height="8" rx="4" fill="#ffffff" fill-opacity=".28"/>
    <rect x="360" y="152" width="58" height="20" rx="10" fill="#22d3ee" fill-opacity=".85"/>
  </g>
  <g>
    <rect x="86" y="198" width="348" height="54" rx="14" fill="#ffffff" fill-opacity=".10"/>
    <rect x="100" y="212" width="26" height="26" rx="8" fill="url(#g3)"/>
    <rect x="140" y="214" width="170" height="10" rx="5" fill="#ffffff" fill-opacity=".55"/>
    <rect x="140" y="230" width="72" height="8" rx="4" fill="#ffffff" fill-opacity=".28"/>
    <rect x="360" y="216" width="58" height="20" rx="10" fill="#ffffff" fill-opacity=".22"/>
  </g>

  <!-- mini bar chart -->
  <g>
    <rect x="86" y="262" width="348" height="78" rx="14" fill="#ffffff" fill-opacity=".08"/>
    <rect x="110" y="308" width="22" height="20" rx="6" fill="#1e6bff"/>
    <rect x="146" y="296" width="22" height="32" rx="6" fill="#3b82f6"/>
    <rect x="182" y="284" width="22" height="44" rx="6" fill="#22d3ee"/>
    <rect x="218" y="300" width="22" height="28" rx="6" fill="#1e6bff"/>
    <rect x="254" y="276" width="22" height="52" rx="6" fill="#22d3ee"/>
    <rect x="290" y="290" width="22" height="38" rx="6" fill="#3b82f6"/>
    <rect x="326" y="270" width="22" height="58" rx="6" fill="#22d3ee"/>
    <rect x="362" y="296" width="22" height="32" rx="6" fill="#1e6bff"/>
  </g>

  <!-- floating badge -->
  <g>
    <rect x="352" y="330" width="130" height="58" rx="18" fill="#0b1b33" stroke="#ffffff" stroke-opacity=".22"/>
    <circle cx="382" cy="359" r="14" fill="url(#g1)"/>
    <path d="M375 359l5 5 9-10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="406" y="350" width="58" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
    <rect x="406" y="364" width="38" height="7" rx="3.5" fill="#ffffff" fill-opacity=".28"/>
  </g>
</svg>
